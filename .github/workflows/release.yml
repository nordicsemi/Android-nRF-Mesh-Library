name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 3.5.2'
        required: true
        type: string
      deploy:
        description: 'Deploy the app to Google Play (Internal)'
        required: false
        type: boolean
        default: true
      dry-run:
        description: 'Dry run'
        required: false
        type: boolean
        default: false
# Only one release at a time.
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
env:
  # The version of the release. The app and the libraries take their version from the latest git
  # tag (see gradle/git-tag-version.gradle), so the Tag stage creates it before they are built.
  RELEASE_VERSION: ${{ inputs.version }}
  # The branch to release.
  BRANCH: ${{ github.ref_name }}
  # When true, nothing is pushed, tagged, published or uploaded.
  DRY_RUN: ${{ inputs.dry-run }}
# The release is made in stages. Each one depends on the previous one, so the graph shows where
# it failed. After fixing the problem, use "Re-run failed jobs" to continue from that stage.
# Publish (Maven Central) and Deploy (Google Play) run in parallel, after the tag is created.
jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          if [[ "${{ github.ref_type }}" != "branch" ]]; then
            echo "::error::Run this workflow on a branch: choose the branch in \"Use workflow from\"."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not a valid version, e.g. 3.5.2 or 3.5.2-alpha01."
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_VERSION" > /dev/null 2>&1; then
            # A dry run does not create the tag, so it may be run for a version that was released.
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::warning::The tag $RELEASE_VERSION already exists, it is ignored in a dry run."
            else
              echo "::error::The tag $RELEASE_VERSION already exists."
              exit 1
            fi
          fi

  tag:
    name: Tag
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # Push the tag.
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          git tag "$RELEASE_VERSION"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: the tag $RELEASE_VERSION is not pushed."
          else
            git push origin "refs/tags/$RELEASE_VERSION"
          fi

  publish:
    name: Publish
    needs: tag
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      # A dry run does not create the tag, so it builds the commit that was selected.
      # The version is taken from the tags, so all of them are needed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry-run && github.sha || format('refs/tags/{0}', inputs.version) }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
          cache: 'gradle'
      - shell: bash
        env:
          # The following env variables are used by gradle/publish-module.gradle
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          # The following env variables are used by gradle/publish-root.gradle
          OSSR_USERNAME: ${{ secrets.OSSR_USERNAME }}
          OSSR_PASSWORD: ${{ secrets.OSSR_PASSWORD }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
        # The script generates sec.gpg file that is required by gradle/publish-module.gradle and
        # runs the Gradle tasks. A dry run builds and signs the libraries into the local Maven
        # repository of the runner, which checks the signing, but publishes nothing. As the tag is
        # not created in a dry run, it is created locally, so that the version is the right one.
        run: |
          java --version
          if [[ "$DRY_RUN" == "true" ]]; then
            git tag "$RELEASE_VERSION"
          fi
          echo "${{ secrets.GPG_FILE }}" > sec.gpg.asc
          gpg -d --passphrase "${{ secrets.GPG_FILE_PSWD }}" --batch sec.gpg.asc > sec.gpg
          if [[ "$DRY_RUN" == "true" ]]; then
            ./gradlew publishToMavenLocal
          else
            ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
          fi

  deploy:
    name: Deploy
    needs: tag
    # Skipped when the app should not be deployed to Google Play, e.g. for a library-only release.
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      # A dry run does not create the tag, so it builds the commit that was selected.
      # The version name and the version code of the app are based on the tags, so all of them
      # are needed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry-run && github.sha || format('refs/tags/{0}', inputs.version) }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
          cache: 'gradle'
      # The runner image does not have Fastlane. It is installed from the Gemfile.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - shell: bash
        env:
          # The following env variables are used by signing configuration in app/build.gradle
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PSWD: ${{ secrets.KEYSTORE_KEY_PSWD }}
          KEYSTORE_PSWD: ${{ secrets.KEYSTORE_PSWD }}
        # The script decodes keystore (required by app/build.gradle) and fastlane-api.json
        # needed by fastlane (see fastlane/Appfile). A dry run builds and signs the app bundle,
        # and Google Play only validates it, nothing is uploaded. As the tag is not created in a
        # dry run, it is created locally, so that the version is the right one.
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            git tag "$RELEASE_VERSION"
          fi
          echo "${{ secrets.KEYSTORE_FILE }}" > keystore.asc
          gpg -d --passphrase "${{ secrets.KEYSTORE_FILE_PSWD }}" --batch keystore.asc > keystore
          echo "${{ secrets.API_KEY_FILE }}" > fastlane-api.json.asc
          gpg -d --passphrase "${{ secrets.API_KEY_FILE_PSWD }}" --batch fastlane-api.json.asc > fastlane-api.json
          bundle exec fastlane deployInternal dry_run:"$DRY_RUN"

  github-release:
    name: GitHub release
    needs: [publish, deploy]
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # Create the release, and generate the notes.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Created only after the libraries were published and, unless it was skipped, the app was
      # deployed. The release uses the tag pushed by the Tag stage, and its notes list the pull
      # requests merged since the previous tag.
      - shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: the release $RELEASE_VERSION is not created. Its notes would be:"
            gh api --method POST "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$RELEASE_VERSION" -f target_commitish="${{ github.sha }}" --jq '.body' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # Versions with a suffix, e.g. 3.5.2-beta01, are marked as pre-releases.
            prerelease=""
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              prerelease="--prerelease"
            fi
            gh release create "$RELEASE_VERSION" --repo "${{ github.repository }}" \
              --title "$RELEASE_VERSION" --generate-notes --verify-tag $prerelease
          fi

  readme:
    name: README
    needs: github-release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # Push the README.
    steps:
      # Updates the version in the README (see moustache/README.mo), as the previous release
      # workflow did. It is the last stage, so the README does not point at a version that
      # was not released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=`./moustache/split.sh "$RELEASE_VERSION"`
          rm -f ./README.md
          VERSION=$VERSION ./moustache/mo ./moustache/README.mo > ./README.md
          git add README.md
          if git diff --cached --quiet; then
            echo "The README is already up to date."
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: the README is not pushed. The changes would be:"
            git diff --cached --stat
          else
            git commit -m "Update readme to version $VERSION"
            git push origin "HEAD:$BRANCH"
          fi
